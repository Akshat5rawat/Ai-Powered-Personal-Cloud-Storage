services:
  mongo:
    image: mongo:5.0
    container_name: ai_personal_cloud_mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=Cluster0
    volumes:
      - mongo_data:/data/db
    ports:
      - 27017:27017

  minio:
    image: minio/minio:latest
    container_name: ai_personal_cloud_minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    ports:
      - 9000:9000
      - 9001:9001
    command: server /data --console-address ":9001"

  backend:
    build: ./backend
    container_name: ai_personal_cloud_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - minio
      - ai-service
    ports:
      - 5000:5000
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules

  frontend:
    build: ./frontend
    container_name: ai_personal_cloud_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    ports:
      - 3000:3000
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules

  ai-service:
    build: ./ai-service
    container_name: ai_personal_cloud_ai
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    depends_on:
      - mongo
      - minio
    ports:
      - 8000:8000
    # volumes:
    #   - ./ai-service:/app

volumes:
  mongo_data:
  minio_data:
